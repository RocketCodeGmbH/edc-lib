openapi: 3.0.1
paths:
  /transfers/request:
    post:
      operationId: initiateTransferProcess
      parameters:
      - in: header
        name: Authorization
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                $ref: "#/components/schemas/JsonValue"
              properties:
                empty:
                  type: boolean
                valueType:
                  type: string
                  enum:
                  - ARRAY
                  - OBJECT
                  - STRING
                  - NUMBER
                  - "TRUE"
                  - "FALSE"
                  - "NULL"
      responses:
        default:
          content:
            application/json: {}
          description: default response
  /transfers/{id}:
    get:
      operationId: getTransferProcess
      parameters:
