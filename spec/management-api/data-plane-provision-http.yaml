openapi: 3.0.1
paths:
  /{flowId}/{resourceId}/deprovision:
    post:
      operationId: deprovision
      parameters:
      - in: path
        name: flowId
        required: true
        schema:
          type: string
      - in: path
        name: resourceId
        required: true
        schema:
          type: string
      responses:
        default:
          content:
            '*/*': {}
          description: default response
  /{flowId}/{resourceId}/provision:
    post:
      operationId: provision
      parameters:
      - in: path
        name: flowId
        required: true
        schema:
          type: string
      - in: path
        name: resourceId
        required: true
        schema:
          type: string
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/ProvisionHttpResponse"
      responses:
        default:
          content:
            '*/*': {}
          description: default response
components:
  schemas:
    DataAddress:
      type: object
      properties:
        properties:
          type: object
          additionalProperties:
            type: object
    ProvisionHttpResponse:
      type: object
      properties:
        dataAddress:
          $ref: "#/components/schemas/DataAddress"
